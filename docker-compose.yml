services:
  postgres:
    image: postgres:16
    container_name: florabelle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER:  ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5438:5432"

    volumes:
      - florabelle_postgres_data:/var/lib/postgresql/data

volumes:
  florabelle_postgres_data:
