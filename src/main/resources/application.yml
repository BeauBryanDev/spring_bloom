spring:
  application:
    name: florabelle

  datasource:
    url: jdbc:postgresql://localhost:5438/${DB_NAME:florabelle}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001

    openai:
      api-key: ${EMBEDDINGS_MODEL_KEY:}
      # Solo embeddings. El chat es Anthropic; sin esto la autoconfiguracion de
      # OpenAI registraria tambien un ChatModel y podria colarse por inyeccion.
      chat:
        enabled: false
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        # El esquema lo manda Flyway (V3) y ddl-auto esta en validate: dejar que
        # Spring AI cree su tabla pondria DDL fuera de Flyway.
        initialize-schema: false
        table-name: vector_store
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  error:
    include-stacktrace: never
    include-message: always

florabelle:
  # Where Stripe sends the customer back after checkout.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

  # Sandbox keys only (sk_test_..., whsec_...). Blank = payments disabled, app still boots.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  agent:
    # Cache de prompt de Anthropic. strategy: NONE, TOOLS_ONLY, SYSTEM_ONLY,
    # SYSTEM_AND_TOOLS o CONVERSATION_HISTORY. ttl: FIVE_MINUTES o ONE_HOUR; con
    # ONE_HOUR, cache-write-per-million de abajo debe pasar a 2.00.
    cache:
      strategy: ${AGENT_CACHE_STRATEGY:CONVERSATION_HISTORY}
      ttl: ${AGENT_CACHE_TTL:FIVE_MINUTES}
    # USD por millon de tokens de claude-haiku-4-5. Confirmar contra la pagina de
    # precios de Anthropic: es una estimacion, tan vigente como estas cifras.
    pricing:
      input-per-million: 1.00
      output-per-million: 5.00
      cache-read-per-million: 0.10
      cache-write-per-million: 1.25

  knowledge:
    # Medido contra el corpus ingerido: el acierto mas debil puntua 0.386 y la
    # pregunta ajena mejor puntuada, 0.243. Por debajo de este umbral no hay
    # respuesta, y no encontrar nada es una respuesta valida.
    similarity-threshold: ${KNOWLEDGE_SIMILARITY_THRESHOLD:0.30}

  vision:
    model-path: ${VISION_MODEL_PATH:file:./vision_model.onnx}

    # Below this, the trained YOLO model's own top detection is treated as a
    # suggestion rather than an answer, and the agent may use its own judgement.
    # At or above it, the model decides and the agent may not overrule it.
    trust-threshold: ${VISION_TRUST_THRESHOLD:0.5}
