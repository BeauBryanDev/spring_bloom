spring:
  application:
    name: florabelle

  datasource:
    url: jdbc:postgresql://localhost:5438/${DB_NAME:florabelle}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001

florabelle:
  vision:
    model-path: ${VISION_MODEL_PATH:file:./vision_model.onnx}
