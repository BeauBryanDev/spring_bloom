<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Editar stock - Panel Admin - Spring-Bloom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/icons/main_logo.svg}"/>
    <style>
        body { font-family: system-ui, sans-serif; background: #f6f4f2; color: #222; margin: 0; }
        .admin-header { display: flex; justify-content: space-between; align-items: center;
                        padding: 1rem 2rem; background: #1c1c1e; color: #fff; }
        .admin-header a { color: #ccc; text-decoration: none; font-size: 0.9rem; }
        .admin-header a.active { color: #fff; font-weight: 700; }
        main { padding: 2rem; max-width: 480px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        label { display: block; font-size: 0.85rem; margin: 1rem 0 0.3rem; color: #555; }
        input, select { width: 100%; padding: 0.55rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { margin-top: 1.5rem; padding: 0.65rem 1.25rem; border: none; border-radius: 6px;
                 background: #d81b60; color: white; font-weight: 600; cursor: pointer; }
        a.back { display: inline-block; margin-bottom: 1rem; color: #555; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav('stock')}"></div>

<main>
    <a class="back" th:href="@{/admin/stock}">&larr; Volver al stock</a>
    <div class="card">
        <h1 th:text="${entry.commonName()} + ' (' + ${entry.speciesKey()} + ')'">Especie</h1>
        <form method="post" th:action="@{'/admin/stock/' + ${entry.speciesKey()}}">
            <label for="status">Estado</label>
            <select id="status" name="status">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s.name() == entry.availability()}"></option>
            </select>

            <label for="quantity">Cantidad</label>
            <input type="number" id="quantity" name="quantity" min="0" th:value="${entry.quantity()}"/>

            <label for="etaDays">ETA (dias, opcional)</label>
            <input type="number" id="etaDays" name="etaDays" min="0" th:value="${entry.etaDays().orElse(null)}"/>

            <label for="basePrice">Precio base (COP)</label>
            <input type="number" step="0.01" id="basePrice" name="basePrice"
                   th:value="${entry.stock().getBasePrice().amount()}"/>

            <label for="importPriceMultiplier">Multiplicador de importacion</label>
            <input type="number" step="0.001" id="importPriceMultiplier" name="importPriceMultiplier"
                   th:value="${entry.stock().getImportPriceMultiplier()}"/>

            <button type="submit">Guardar</button>
        </form>
    </div>
</main>
</body>
</html>
