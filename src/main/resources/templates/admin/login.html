<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Acceso Admin - Spring-Bloom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/icons/main_logo.svg}"/>
    <style>
        body { font-family: system-ui, sans-serif; background: #1c1c1e; color: #eee;
               display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #2a2a2e; padding: 2.5rem; border-radius: 12px; width: 320px; }
        h1 { font-size: 1.25rem; margin: 0 0 1.5rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #bbb; }
        input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border-radius: 6px;
                border: 1px solid #444; background: #1c1c1e; color: #eee; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; border: none; border-radius: 6px;
                 background: #d81b60; color: white; font-weight: 600; cursor: pointer; }
        .btn-home { display: block; width: 100%; box-sizing: border-box; margin-top: 0.75rem;
                    padding: 0.7rem; border-radius: 6px; background: transparent;
                    border: 1px solid #444; color: #ccc; text-align: center;
                    text-decoration: none; font-weight: 600; }
        .btn-home:hover { border-color: #666; color: #fff; }
        .message { padding: 0.6rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
        .message.error { background: #4a1d21; color: #ff8a8a; }
        .message.info { background: #1d3a2a; color: #8affa8; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Panel de Administracion - Spring-Bloom</h1>
    <p th:if="${error}" class="message error">Correo o contrasena incorrectos.</p>
    <p th:if="${loggedOut}" class="message info">Sesion cerrada.</p>
    <form method="post" th:action="@{/admin/login}">
        <label for="username">Correo</label>
        <input type="email" id="username" name="username" required autocomplete="username"/>
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"/>
        <button type="submit">Ingresar</button>
    </form>
    <a class="btn-home" href="/">Regresar</a>
</div>
</body>
</html>
