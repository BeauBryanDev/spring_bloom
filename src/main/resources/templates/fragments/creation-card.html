<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  A garland or a flower crown: a composed creation, not a species. These are
  presentation-only for now - a crown is not a product_type in the database yet,
  so nothing here is priced by the pricing strategies, quotable by Florabelle or
  accepted by the cart. The button asks the shop by email instead; it used to be
  a cart button that /api/cart could never accept.
-->
<article th:fragment="card(creation)" class="creation-card">
    <div class="creation-image">
        <img th:src="@{'/assets/creations/' + ${creation.imagePath}}"
             th:alt="${creation.name}"/>
    </div>
    <div class="creation-body">
        <h4 th:text="${creation.name}">Garland Clasico</h4>
        <p class="creation-composition" th:text="${creation.composition}">Mix de verdes y flores</p>
        <p class="creation-description" th:text="${creation.description}">Guirnalda de follaje fresco.</p>
        <div class="creation-footer">
            <span class="creation-price" th:text="${creation.price}"
                  title="Precio de referencia">$165.000 COP</span>
            <a class="creation-request"
               th:href="'mailto:' + ${@contactDetails.email} + '?subject=' + ${#uris.escapeQueryParam('Solicitud: ' + creation.name)}"
               th:aria-label="'Solicitar ' + ${creation.name}">Solicitar</a>
        </div>
    </div>
</article>

</body>
</html>
